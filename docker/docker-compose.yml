version: '3.9'

services:
  backend:
    build:
      context: ../backend
    ports:
      - '5000:5000'
    env_file:
      - ../backend/.env
    depends_on:
      - mongo
      - mysql
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_change_me
      MYSQL_DATABASE: vr_lawyer_reports
      MYSQL_USER: vr_lawyer
      MYSQL_PASSWORD: change_me
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  mysql_data:
  redis_data:
